<script id="core">
'use strict';
const DATA=[[101,'Ana','Santos',250,'Pendente'],[102,'Bruno','Registro',800,'Entregue'],[103,'Carla','Santos',750,'Pendente'],[104,'Diego','Campinas',920,'Pendente'],[105,'Elisa','Santos',610,'Entregue'],[106,'Fábio','Registro',420,'Pendente'],[107,'Aline','Campinas',380,'Entregue'],[108,'Heitor','Registro',1150,'Pendente'],[109,'Iara','Campinas',560,'Pendente'],[110,'João','Santos',990,'Cancelado']];
const COLS=['id','cliente','cidade','valor','status'];
const SCHEMA='CREATE TABLE pedidos(id INTEGER PRIMARY KEY, cliente TEXT, cidade TEXT, valor REAL, status TEXT)';
const strip=q=>q.replace(/--[^\n]*/g,' ').replace(/\/\*[\s\S]*?\*\//g,' ');
const noStr=q=>q.replace(/'([^']|'')*'/g,"''");
function guard(q){const c=strip(String(q||'')).trim();if(!c)return 'Digite uma consulta antes de executar.';
 if(noStr(c).replace(/;\s*$/,'').includes(';'))return 'Execute uma instrução por vez: remova o ; do meio da consulta.';
 if(!/^select\b/i.test(c))return /^(insert|update|delete|drop|alter|create|replace|pragma|attach|vacuum|begin|commit)\b/i.test(c)?'Aqui só é permitido consultar com SELECT. A base de dados não pode ser alterada.':'A consulta precisa começar com SELECT.';return ''}
function friendly(m){m=String(m);let r;
 if(r=m.match(/no such column: (.+)/i))return `A coluna «${r[1]}» não existe. Colunas da tabela: ${COLS.join(', ')}. Textos precisam de aspas simples, como 'Santos'.${/^(des|dsc|dec|asc|acs)\w*$/i.test(r[1])?' Você quis escrever DESC (decrescente) ou ASC (crescente)?':''}`;
 if(/no such table/i.test(m))return 'Tabela não encontrada. Nesta aula, use FROM pedidos.';
 if(r=m.match(/near "([^"]*)": syntax error/i))return `Erro de sintaxe perto de «${r[1]}». Confira as vírgulas entre colunas, a ordem SELECT → FROM → WHERE → ORDER BY e as aspas. Para comparar, use um operador (=, <, >) e coloque textos entre aspas simples: status = 'Pendente'.`;
 if(/incomplete input/i.test(m))return 'A consulta está incompleta: falta algo no final (coluna, tabela, valor ou aspas).';
 if(/unrecognized token/i.test(m))return 'Há um caractere inválido ou aspas não fechadas. Textos usam aspas simples.';
 if(/syntax error/i.test(m))return 'Erro de sintaxe. Estrutura esperada: SELECT colunas FROM pedidos WHERE condição ORDER BY coluna.';
 return 'O SQLite não conseguiu executar a consulta: '+m}
function run(ad,q){const g=guard(q);if(g)throw new Error(g);try{return ad(q)}catch(e){throw new Error(friendly(e.message||e))}}
const bad=m=>({ok:false,msg:m});
function judge(o,s,x){const n=x.cols.length,m=o.cols.length,L=o.rows.length,F=x.rows.length;
 if(!L)return bad('A consulta executou, mas não retornou nenhuma linha. Revise a condição do WHERE.');
 if(m<n||(!s.extra&&m>n))return bad(`O resultado tem ${m} coluna(s), mas o enunciado pede ${s.extra?'pelo menos ':''}${n}${s.want?' ('+s.want+')':''}. Releia o que deve aparecer no resultado${m>n?' (SELECT * mostra colunas demais)':''}.`);
 const part=!!(s.minRows&&s.ordered&&L<F);
 if(part&&L<s.minRows)return bad(`O resultado tem ${L} linha(s); para decidir é preciso ver pelo menos ${s.minRows}.`);
 if(L!==F&&!part)return bad(L>F?`Foram retornadas ${L} linhas, mas só ${F} atendem ao pedido. Falta filtrar com WHERE ou a condição está ampla demais.`:`Foram retornadas ${L} linhas, mas o pedido tem ${F}. A condição do WHERE está restritiva demais.`);
 const XR=part?x.rows.slice(0,L):x.rows,K=a=>a.join('\u0001'),S=a=>K(a.slice().sort()),map=[],used=new Set();
 for(let i=0;i<n;i++){const b=XR.map(r=>String(r[i]));let f=-1,same=false;
  for(let j=0;j<m;j++){if(used.has(j))continue;const a=o.rows.map(r=>String(r[j]));
   if(s.ordered?K(a)===K(b):S(a)===S(b)){f=j;break}if(S(a)===S(b))same=true}
  if(f<0)return bad(same?'As linhas certas apareceram, mas fora da ordem pedida. Revise o ORDER BY: coluna de ordenação e ASC/DESC.':`Os valores da coluna «${x.cols[i]}» não correspondem ao pedido. Confira colunas, WHERE e ordenação.`);
  used.add(f);map.push(f)}
 if(!s.ordered){const e=XR.map(r=>r.map(String).join('\u0001')).sort(),a=o.rows.map(r=>map.map(j=>String(r[j])).join('\u0001')).sort();if(K(a)!==K(e))return bad('As colunas certas aparecem, mas combinadas em linhas erradas.')}
 return{ok:true}}
function check(ad,q,s){const o=run(ad,q),x=run(ad,s.sql);
 if(/\bselect\s+(?!distinct\b)\w+\s+(?!as\b|from\b)\w+\s+from\b/i.test(noStr(strip(q))))return{ok:false,msg:'Parece faltar uma vírgula entre as colunas. Sem vírgula, o SQL entende o segundo nome como apelido (alias) da primeira coluna.',out:o};
 const j=judge(o,s,x);
 if(j.ok){const c=noStr(strip(q));for(const k of s.need||[])if(!new RegExp('\\b'+k.replace(' ','\\s+')+'\\b','i').test(c))return{ok:false,msg:`O resultado confere, mas o enunciado pede que você use ${k}.`,out:o}}
 return{...j,out:o}}
const LABS=[
 {t:'Mostre <b>cliente</b> e <b>valor</b> dos pedidos com status <b>Entregue</b>, do <b>maior para o menor</b> valor.',sql:"SELECT cliente, valor FROM pedidos WHERE status = 'Entregue' ORDER BY valor DESC",ordered:true,want:'cliente e valor',need:['WHERE','ORDER BY'],
  hints:['Três decisões: quais colunas mostrar, qual linha filtrar e em que ordem apresentar.','Estrutura: SELECT ... FROM pedidos WHERE ... ORDER BY ...','Falta só preencher: WHERE status = '+"'Entregue'"+' e ORDER BY valor com a direção que coloca o maior primeiro.'],sol:"SELECT cliente, valor FROM pedidos WHERE status = 'Entregue' ORDER BY valor DESC;"}];
const CASE={sql:"SELECT cidade, cliente, valor FROM pedidos WHERE status = 'Pendente' ORDER BY valor DESC",ordered:true,extra:true,want:'cidade, cliente e valor',minRows:4,need:['WHERE','ORDER BY'],sol:"SELECT cidade, cliente, valor FROM pedidos WHERE status = 'Pendente' ORDER BY valor DESC;"};
const GAME=[
 {goal:'A gerente pergunta: <b>“Quais clientes de Santos têm pedidos Pendentes e qual o valor de cada pedido?”</b> Qual consulta responde exatamente à solicitação?',opts:[
  {label:"SELECT cliente, valor FROM pedidos WHERE cidade = 'Santos' AND status = 'Pendente';",ok:1,why:'Correto. SELECT mostra cliente e valor; WHERE com AND mantém somente os pedidos pendentes de Santos.'},
  {label:"SELECT cliente, valor FROM pedidos WHERE cidade = 'Santos';",ok:0,why:'Essa consulta inclui todos os pedidos de Santos, inclusive os Entregues e Cancelados. Falta filtrar por status.'},
  {label:"SELECT cliente, cidade FROM pedidos WHERE cidade = 'Santos' AND status = 'Pendente';",ok:0,why:'O filtro está certo, mas o resultado mostra cidade em vez de valor, solicitado pela gerente.'},
  {label:"SELECT cliente, valor FROM pedidos WHERE cidade = 'Santos' AND status = 'Entregue';",ok:0,why:'O filtro seleciona pedidos Entregues, mas a solicitação pede Pendentes.'}]},
 {goal:'A gerente pediu <b>somente pedidos pendentes</b>, ordenados pelo valor decrescente. A consulta abaixo executa normalmente, mas o resultado não atende ao pedido. <b>Qual é o problema?</b>',show:"SELECT cliente, valor FROM pedidos ORDER BY valor DESC;",opts:[
  {label:'Faltou selecionar a coluna cidade.',ok:0,why:'O enunciado não pede a cidade no resultado.'},
  {label:'A consulta deveria ordenar por nome.',ok:0,why:'A gerente pediu ordenação por valor.'},
  {label:'Faltou filtrar os pedidos pendentes com WHERE.',ok:1,why:'Sem WHERE, entram também pedidos Entregues e Cancelados. SQL válido não garante resposta correta.'},
  {label:'DESC deveria ser substituído por ASC.',ok:0,why:'DESC é a direção correta para maior valor primeiro.'}]}];
if(typeof module!=='undefined')module.exports={DATA,COLS,SCHEMA,guard,friendly,run,judge,check,LABS,CASE,GAME};

const S={cur:0,done:new Set(),teacher:false,el:0,run:false,t1:0,ready:false,err:'',ad:null,tv:true,a1:{pk:null,map:{}},dir:'DESC',q:{},v:{link:'',from:'',to:'',note:'',msg:''},sent:false,tr:false,g:{r:0,sel:null,done:[0,0],tried:[[],[]]},lab:{i:0,txt:[''],res:[null],hint:[0],ok:[false]},c:{txt:'',res:null,hint:0,city:null,ev:null,msg:'',q:false}};

function m1(){const a=S.a1;

 <div class="g3"><div class="box"><h3>Tabela</h3>Conjunto de registros sobre um mesmo assunto: <code>pedidos</code>.</div><div class="box"><h3>Linha (registro)</h3>Um pedido completo.</div><div class="box"><h3>Coluna</h3>Uma característica de todos os pedidos, como <code>valor</code>.</div></div>

 const original=[
 `In regard to semantic errors, previous research presents definitions for different levels of precision. Buitendijk [6, p. 79] states that a query that contains a semantic error is produced with “an erroneous train of thought”. Buitendijk’s [6] study contains the word pair logical errors, but the SQL errors that are not syntax errors are called semantic errors. However, Buitendijk [6] points out that it is possible for a user to commit a logical error, which results in the query being incorrect for the particular data demand. Smelcer [34] and Ahadi et al. [1] propose that the semantically incorrect query is syntactically correct but returns information not intended by the user. Ahadi et al. [3] state that a query with a semantic error produces either an empty result table or a result table that is not the same as desired.`,
 `Brass and Goldberg [4] detail the semantic error definition by stating that the SQL query is legal (i.e., syntactically correct) but does not always produce the intended results for a given data demand (they use the word task). Brass and Goldberg [4] make a further distinction between queries that are incorrect regardless of the data demand and queries that are incorrect for a particular data demand. These authors leave the latter class of semantic errors outside of their study and state that it is possible to implement functionality to DBMSs to detect the former class of semantic errors. We consider these former and latter classes of semantic errors fundamentally different by definition and from now on call the latter class logical errors and the former class semantic errors.`];
 const translation=[
 `Em relação aos erros semânticos, pesquisas anteriores apresentam definições com diferentes níveis de precisão. Buitendijk [6, p. 79] afirma que uma consulta que contém um erro semântico é produzida por “uma linha de raciocínio equivocada”. O estudo de Buitendijk [6] utiliza a expressão erros lógicos, mas denomina erros semânticos os erros de SQL que não são erros de sintaxe. Entretanto, Buitendijk [6] observa que um usuário pode cometer um erro lógico que torna a consulta incorreta para uma necessidade específica de informação. Smelcer [34] e Ahadi et al. [1] propõem que uma consulta semanticamente incorreta está sintaticamente correta, mas retorna informações que não eram pretendidas pelo usuário. Ahadi et al. [3] afirmam que uma consulta com erro semântico produz uma tabela de resultados vazia ou diferente da desejada.`,
 `Brass e Goldberg [4] detalham a definição de erro semântico afirmando que a consulta SQL é válida (isto é, sintaticamente correta), mas nem sempre produz os resultados pretendidos para determinada necessidade de informação (eles usam o termo tarefa). Brass e Goldberg [4] distinguem ainda consultas incorretas independentemente da necessidade de informação e consultas incorretas para uma necessidade específica. Esses autores não abordaram em seu estudo essa segunda classe de erros semânticos e afirmam ser possível implementar funcionalidades nos sistemas gerenciadores de bancos de dados para detectar a primeira classe. Consideramos essas duas classes fundamentalmente diferentes em sua definição e, a partir deste ponto, denominamos a segunda classe erros lógicos e a primeira classe erros semânticos.`];

 const lock=false;
 E('main').innerHTML=`${S.teacher&&c?`<details class="tch"><summary>${ic('lock')} Resolução da professora</summary><p>${h(NOTES[c])}</p></details>`:''}<div class="card">${c>0&&c<8?`<div class="row sp"><h2>Missão ${c} · ${TIT[c]}</h2><span class="row"><span class="chip">${SK[c]}</span><span class="chip">${ic('clock')} ${TM[c]}</span></span></div>`:''}${VIEW[c]()}</div>
 <div class="nav"><button class="btn alt" ${c?'':'disabled'} onclick="go(${c-1})">← Voltar</button>${c<8?`<span class="row"><button class="btn" ${lock?'disabled':''} onclick="go(${c+1})">${c===7?'Encerrar aula':'Continuar'} →</button></span>`:''}</div>`;
 E('tb').innerHTML=ic('lock')+(S.teacher?' Professora ativa':' Professora')}
function setLab(v){S.lab.txt[S.lab.i]=v}function setCase(v){S.c.txt=v}
function tick(){const t=Math.floor((S.el+(S.run?Date.now()-S.t1:0))/1000);E('clock').innerHTML=ic('clock')+' '+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')+(S.run?'':' · parado')}
function paintPP(){E('pp').innerHTML=ic(S.run?'pause':'play');const l=S.run?'Pausar cronômetro':'Iniciar cronômetro';E('pp').title=l;E('pp').setAttribute('aria-label',l)}
function toggleClock(){if(S.run){S.el+=Date.now()-S.t1;S.run=false}else{S.t1=Date.now();S.run=true}paintPP();tick()}
function restartClock(){if(confirm('Zerar o cronômetro da aula? Ele ficará parado até você iniciar.')){S.el=0;S.run=false;paintPP();tick()}}
function openTeacher(){if(S.teacher)return;E('modal').innerHTML=`<div class="modal"><div class="card"><h3>Acesso da professora</h3><label for="pw">Senha</label><input id="pw" class="pw" type="password" autocomplete="off" onkeydown="if(event.key=='Enter')unlock()"><div id="pm" class="mu"></div><div class="row"><button class="btn" onclick="unlock()">Entrar</button><button class="btn alt" onclick="E('modal').innerHTML=''">Cancelar</button></div></div></div>`;E('pw').focus()}
function unlock(){if(E('pw').value===PW){S.teacher=true;try{sessionStorage.setItem('sqld2','1')}catch(e){}E('modal').innerHTML='';render()}else E('pm').textContent='Senha incorreta.'}
function mkAdapter(Q){return q=>{const d=new Q.Database();try{d.run(SCHEMA);const s=d.prepare('INSERT INTO pedidos VALUES(?,?,?,?,?)');DATA.forEach(r=>s.run(r));s.free();d.run('PRAGMA query_only=1');const o=d.exec(q);return o.length?{cols:o[0].columns,rows:o[0].values}:{cols:[],rows:[]}}finally{d.close()}}}
async function boot(){try{if(typeof initSqlJs!=='function')throw 0;S.ad=mkAdapter(await initSqlJs({locateFile:f=>CDN+f}));S.ready=true}catch(e){S.err='SQLite indisponível: é preciso internet para carregar o mecanismo. Recarregue a página.'}const a=document.activeElement;if(!a||(a.tagName!=='TEXTAREA'&&a.tagName!=='INPUT'))render()}
E('lg').innerHTML=ic('search');E('rc').innerHTML=ic('reset');try{S.teacher=sessionStorage.getItem('sqld2')==='1'}catch(e){}
document.addEventListener('keydown',e=>{if(e.altKey&&e.shiftKey&&e.key.toLowerCase()==='p')openTeacher()});
paintPP();tick();setInterval(tick,1000);render();boot();
</script></body></html>
